  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-dasharray="550" stroke-dashoffset="275" />
  <!-- Forklift / sales silhouette -->
  <g filter="url(#shadow)" fill="#0f172a">
    <path d="M55 110 L75 110 L75 85 Q75 75 85 75 Q95 75 95 85 L95 110 L105 110 L105 75 Q105 65 115 65 Q125 65 125 75 L125 110 L135 110 L135 85 Q135 75 145 75 Q155 75 155 85 L155 110 L160 110 L160 125 L45 125 L45 110 Z" />
    <circle cx="60" cy="128" r="8" fill="#006c49" />
    <circle cx="138" cy="128" r="8" fill="#006c49" />
  </g>
  <!-- Text: FV -->
  <text x="100" y="160" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="2">FV</text>
  <text x="100" y="182" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">FUERZA DE VENTA</text>
</svg>
